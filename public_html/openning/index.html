<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#141510">
  <title>Boas-vindas à Sthetic Center</title>
  <link rel="icon" href="../assets/favicon.png">
  <style>
    * { box-sizing: border-box; }
    html { background: #141510; color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      background: #141510;
      color: #f4f1e9;
      font-family: Arial, sans-serif;
    }
    ::selection { background: #c8ac76; color: #141510; }
    main {
      width: min(100%, 560px);
      text-align: center;
      transition: opacity 240ms ease, transform 240ms ease;
    }
    .brand {
      position: relative;
      width: clamp(220px, 55vw, 320px);
      aspect-ratio: 320 / 183;
      margin: 0 auto 36px;
      animation: arrival 1.2s cubic-bezier(.16, 1, .3, 1) both;
    }
    .brand img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .brand-base { opacity: .28; }
    .brand-light {
      position: absolute;
      inset: 0;
      animation: illuminate 1.6s ease-in-out infinite;
    }
    h1 {
      margin: 0 0 18px;
      font: 400 clamp(30px, 5.5vw, 42px)/1.2 Georgia, serif;
      text-wrap: balance;
    }
    h1 span { display: block; color: #c8ac76; }
    p { margin: 0; color: #c4c9b7; font-size: 14px; line-height: 1.8; }
    .leaving main { opacity: 0; transform: scale(1.035); }
    @keyframes arrival {
      from { transform: scale(.86); opacity: .45; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes illuminate {
      0% { clip-path: inset(0 100% 0 0); opacity: .55; }
      60%, 80% { clip-path: inset(0 0 0 0); opacity: 1; }
      100% { clip-path: inset(0 0 0 0); opacity: .15; }
    }
    @media (prefers-reduced-motion: reduce) {
      .brand, .brand-light { animation: none; }
      .brand-light { opacity: 1; }
      main { transition: opacity 240ms ease; }
      .leaving main { transform: none; }
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18542890634"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18542890634');
  </script>
  <script src="openning.js?v=20261029-opening-1500" defer></script>
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true">
      <img class="brand-base" src="../assets/logo-sc.webp" alt="" width="320" height="183">
      <img class="brand-light" src="../assets/logo-sc.webp" alt="" width="320" height="183">
    </div>
    <h1>Boas-vindas à <span>Sthetic Center.</span></h1>
    <p role="status">Você será redirecionado para o nosso site.</p>
  </main>
</body>
</html>
